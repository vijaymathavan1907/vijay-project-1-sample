<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <filter id="white-granite-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="6" seed="5" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" in="noise" values="0.8 0 0 0 0.88 0 0.8 0 0 0.87 0 0 0.8 0 0.86 0 0 0 1 0" result="colored"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="12" result="veins"/>
      <feColorMatrix type="matrix" in="veins" values="0.3 0 0 0 0.7 0 0.3 0 0 0.69 0 0 0.3 0 0.68 0 0 0 0.4 0" result="veinColor"/>
      <feComposite in="colored" in2="veinColor" operator="arithmetic" k1="0" k2="0.7" k3="0.3" k4="0"/>
    </filter>
    <linearGradient id="white-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#E8E5E0"/>
  <rect width="100%" height="100%" filter="url(#white-granite-texture)"/>
  <rect width="100%" height="100%" fill="url(#white-sheen)"/>
</svg>
